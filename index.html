<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentiment Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: #f9f9f9;
    }
    h2 {
      color: #333;
    }
    textarea {
      width: 100%;
      height: 150px;
      font-size: 14px;
      padding: 10px;
      margin-bottom: 1rem;
    }
    button {
      padding: 10px 20px;
      font-size: 14px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #004999;
    }
    .result {
      margin-top: 2rem;
    }
    .review-card {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 1rem;
      padding: 1rem;
    }
    .sentiment {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Sentiment Analysis Tool</h2>
  <p>Enter multiple reviews (one per line):</p>
  <textarea id="reviewInput" placeholder="The hotel was fantastic!&#10;The food was terrible."></textarea>
  <button onclick="analyzeSentiments()">Analyze</button>

  <div class="result" id="results"></div>

  <script>
    async function analyzeSentiments() {
      const input = document.getElementById("reviewInput").value.trim();
      if (!input) return;

      const reviews = input.split('\n').filter(line => line.trim());

      const resultsContainer = document.getElementById("results");
      resultsContainer.innerHTML = '';

      for (let review of reviews) {
        const response = await fetch('http://127.0.0.1:5000/predict', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ review })
        });

        const result = await response.json();

        const card = document.createElement('div');
        card.className = 'review-card';
        card.innerHTML = `
          <p><strong>Review:</strong> ${result.review}</p>
          <p class="sentiment">Sentiment: ${result.sentiment}</p>
        `;
        resultsContainer.appendChild(card);
      }
    }
  </script>

</body>
</html>
